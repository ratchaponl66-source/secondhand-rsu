<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงประกาศขาย - Secondhand RSU</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="bg-rsu-50/40 font-sans text-ink-900">
  <header id="nav" class="border-b border-rsu-100 bg-white"></header>
  <main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="font-display text-2xl text-ink-700">ลงประกาศขายสินค้า</h1>
    <p class="mt-1 text-sm text-ink-500">ประกาศจะแสดงบนหน้าตลาดหลังจาก Admin อนุมัติ</p>

    <div id="loginNote" class="mt-4 hidden rounded-lg border border-rsu-200 bg-rsu-100 px-4 py-2 text-sm text-rsu-800">
      ต้องเข้าสู่ระบบก่อนจึงจะส่งประกาศได้ <a href="/login.html" class="font-medium underline">เข้าสู่ระบบ</a>
    </div>
    <p id="categoryError" role="alert" class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-800"></p>

    <form id="f" class="mt-5 space-y-5 rounded-xl border border-ink-100 bg-white p-5 sm:p-6" novalidate>
      <div>
        <label class="mb-1 block text-sm font-medium">ชื่อสินค้า</label>
        <input name="title" required maxlength="120" placeholder="เช่น หนังสือ Database System Concepts สภาพดี"
          class="w-full rounded-lg border border-ink-100 px-3 py-2 outline-none focus:border-rsu-400 focus:ring-2 focus:ring-rsu-100">
      </div>
      <div class="grid gap-5 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-medium">หมวดหมู่</label>
          <select name="category_id" id="cat" required class="w-full rounded-lg border border-ink-100 bg-white px-3 py-2 outline-none focus:border-rsu-400"></select>
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium">ราคา (บาท)</label>
          <input name="price" type="number" min="0" step="1" required placeholder="0"
            class="w-full rounded-lg border border-ink-100 px-3 py-2 outline-none focus:border-rsu-400 focus:ring-2 focus:ring-rsu-100">
        </div>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium">รายละเอียดสินค้า</label>
        <textarea name="description" rows="4" placeholder="สภาพสินค้า ระยะเวลาที่ใช้ จุดที่นัดรับ"
          class="w-full rounded-lg border border-ink-100 px-3 py-2 outline-none focus:border-rsu-400 focus:ring-2 focus:ring-rsu-100"></textarea>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium">ช่องทางติดต่อ / เบอร์โทร</label>
        <input name="contact_phone" placeholder="เช่น 08x-xxx-xxxx หรือ LINE ID"
          class="w-full rounded-lg border border-ink-100 px-3 py-2 outline-none focus:border-rsu-400 focus:ring-2 focus:ring-rsu-100">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium">รูปสินค้า</label>
        <div id="drop" tabindex="0" class="flex min-h-[10rem] cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-rsu-200 bg-rsu-50 p-4 text-center transition hover:border-rsu-400">
          <img id="preview" class="mb-2 hidden max-h-44 rounded-lg object-contain" alt="ตัวอย่างรูป">
          <p id="dropText" class="text-sm text-ink-700"><span class="font-medium text-rsu-600">ลากรูปมาวางที่นี่</span> หรือกดเพื่อเลือกไฟล์<br><span class="text-xs text-ink-500">JPG, PNG, WEBP ไม่เกิน 3 MB</span></p>
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
        </div>
      </div>
      <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <a href="/" class="rounded-lg border border-ink-100 px-5 py-2.5 text-center text-sm text-ink-700 hover:bg-ink-50">ยกเลิก</a>
        <button class="rounded-lg bg-rsu-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-rsu-700">ส่งประกาศ</button>
      </div>
    </form>
  </main>

  <script src="/js/app.js"></script>
  <script>
    renderNav();
    if (!store.token) loginNote.classList.remove('hidden');
    let image = null;

    (async () => {
      try {
        const cats = await api('/products/categories');
        cat.innerHTML = '<option value="">เลือกหมวดหมู่</option>' + cats.map((c) => `<option value="${c.category_id}">${esc(c.category_name)}</option>`).join('');
        categoryError.classList.add('hidden');
      } catch (error) {
        categoryError.textContent = `โหลดหมวดหมู่ไม่สำเร็จ: ${error.message}`;
        categoryError.classList.remove('hidden');
      }
    })();

    function setFile(file) {
      if (!file) return;
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return toast('รองรับเฉพาะไฟล์ JPG, PNG, WEBP', 'err');
      if (file.size > 3 * 1024 * 1024) return toast('ไฟล์ใหญ่เกิน 3 MB', 'err');
      image = file;
      preview.src = URL.createObjectURL(file); preview.classList.remove('hidden');
      dropText.textContent = file.name + ' (กดเพื่อเปลี่ยนรูป)';
    }
    drop.onclick = () => file.click();
    drop.onkeydown = (e) => (e.key === 'Enter' || e.key === ' ') && file.click();
    file.onchange = () => setFile(file.files[0]);
    ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('border-rsu-600', 'bg-rsu-100'); }));
    ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('border-rsu-600', 'bg-rsu-100'); }));
    drop.addEventListener('drop', (e) => setFile(e.dataTransfer.files[0]));

    f.onsubmit = async (e) => {
      e.preventDefault();
      if (!store.token) return (location.href = '/login.html');
      const fd = new FormData(f);
      if (!fd.get('title').trim() || !fd.get('category_id') || fd.get('price') === '') return toast('กรอกชื่อสินค้า หมวดหมู่ และราคาให้ครบ', 'err');
      if (image) fd.append('image', image);
      try {
        const r = await api('/products', { method: 'POST', body: fd });
        toast(r.message); setTimeout(() => (location.href = '/'), 1200);
      } catch (x) { toast(x.message, 'err'); }
    };
  </script>
</body>
</html>
